name: Matriz de Estrategia - Test en Multiples versiones de Python

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Descargar el archivo del repositorio
        uses: actions/checkout@v4
      - name: Configurar Python ${{matrix.python-version}}
        uses: actions/setup-python@v5
        with: 
          python-version: ${{matrix.python-version}}
      - name: Instalar dependencias imaginarias
        run: |
          echo "Instalando dependencias para Python ${{ matrix.python-version }}..."
          # pip install -r requirements.txt
      - name: Ejecutar pruebas
        run: |
          echo "Ejecutando tests en Python ${{ matrix.python-version }}..."
          python --version
          # pytest