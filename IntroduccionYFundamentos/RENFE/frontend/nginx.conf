# ============================================================================
# CONFIGURACIÓN NGINX DEL FRONTEND
# Sirve index.html y reenvía /api/... al backend FastAPI. Así el navegador
# solo habla con un origen (sin CORS) y nunca ve la base de datos.
# ============================================================================
server {
    # Puerto interno del contenedor
    listen 80;
    # Carpeta con los ficheros estáticos
    root /usr/share/nginx/html;
    # Fichero por defecto
    index index.html;

    # DNS interno de Docker; se vuelve a consultar cada 10 s. Si el backend se
    # recrea con otra IP, nginx la encuentra sin reiniciarse.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Dirección del backend en una variable: obliga a resolver el nombre en cada petición
    set $backend http://backend:8000;

    # /api/getTrenes?x=1 -> http://backend:8000/getTrenes?x=1
    location /api/ {
        # Quitamos el prefijo /api de la ruta
        rewrite ^/api/(.*)$ /$1 break;
        # Reenviamos al servicio "backend" de Docker Compose
        proxy_pass $backend;
        # Reenviamos el host original
        proxy_set_header Host $host;
        # No esperar más de 5 s para conectar con el backend
        proxy_connect_timeout 5s;
        # Ni más de 15 s por respuesta
        proxy_read_timeout 15s;
    }
}
